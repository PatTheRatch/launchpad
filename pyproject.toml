[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchpad"
version = "0.0.0"
description = "A Raspberry Pi e-ink family dashboard for the front door."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Patrick McDowell" }]
keywords = ["raspberry-pi", "e-ink", "dashboard", "epaper"]

# Core runtime dependencies are intentionally minimal. Hardware- and
# service-specific packages should be added as optional extras so the core
# dashboard stays lightweight and portable.
#
# tzdata provides the IANA time zone database for zoneinfo so Europe/London
# (and DST transitions) resolve consistently on every platform.
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
eink = []          # vendor e-ink panel drivers (Raspberry Pi only)
render = [          # image/drawing backend
    "pillow>=10.4",
]
tfl = [             # live TfL Arrivals integration (typed HTTP + .env loading)
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
web = [             # configuration web UI (Flask)
    "flask>=3.0",
]
baby = [            # Huckleberry "last feed" section
    # Pinned: 0.2.3+ requires Python 3.14; the Pi runs 3.13. Do not upgrade
    # until the Pi's Python does.
    "huckleberry-api==0.2.2",
]

[project.scripts]
launchpad = "launchpad.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/launchpad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Pin the historical default rule set so newer ruff releases (whose defaults
# grew much broader) don't change what "clean" means for this repo.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

# The Huckleberry client is an optional extra and the Waveshare driver is
# Pi-only/untyped; keep `mypy src` clean on machines without them installed.
[[tool.mypy.overrides]]
module = ["huckleberry_api.*", "waveshare_epd.*"]
ignore_missing_imports = true
